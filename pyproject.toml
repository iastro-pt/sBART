[project]
name = "SBART"
version = "1.1.0"
description = "sBART model for RV extraction"
readme = "README.md"
requires-python = ">=3.11,<=3.13.13"
dependencies = [
    "astra-spectra",
    "astropy>=7.0.1",
    "astroquery>=0.4.10",
    "cibuildwheel>=3.3.0",
    "corner>=2.2.3",
    "emcee>=3.1.6",
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "numpy<2.0.0",
    "pyyaml>=6.0.2",
    "scipy>=1.15.2",
    "tabletexifier>=0.3.4",
    "ujson>=5.10.0",
]

[build-system]
requires = ["setuptools", "wheel", "cython>=3.0.0", "numpy"]
build-backend = "setuptools.build_meta"


[tool.towncrier]
name = "SBART"
package = "SBART"
directory = "newsfragments/"
filename = "docs/NEWS.rst"
issue_format = "`#{issue} <https://github.com/iastro-pt/sBART/issues/{issue}>`_"
underlines = "~~~"
template = "towncrier_template.rst"

[tool.towncrier.fragment.feature]
[tool.towncrier.fragment.break]
[tool.towncrier.fragment.bugfix]

[tool.towncrier.fragment.misc]
showcontent = true


[tool.ruff.lint]
select = ["ALL"]

[dependency-groups]
dev = [
    "cython>=3.0.12",
    "ipykernel>=6.29.5",
    "mypy>=1.15.0",
    "nbsphinx>=0.9.7",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.5",
    "setuptools>=78.1.0",
    "sphinx>=8.1.3",
]

[tool.ruff]
line-length = 120
